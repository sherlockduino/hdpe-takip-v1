name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Python 3.10 Kurulumu (En kararlı sürüm)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Disk Temizliği (Yer açmak için)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      # 4. Gerekli Kütüphaneler
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libffi-dev libssl-dev python3-dev build-essential \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libltdl-dev

      # 5. Buildozer Kurulumu
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.36"

      # 6. APK Derleme (LOGLU VE GÜVENLİ)
      # -v parametresi ekledik, hata olursa neden olduğunu yazar.
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      # 7. APK Yükleme
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hdpe-takip-apk
          path: bin/*.apk
