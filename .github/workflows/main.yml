name: APK Yapici (Cython Fix)
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Python Kurulumu
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Gerekli Kütüphaneler (VE CYTHON SABİTLEME!)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libffi-dev libssl-dev python3-dev build-essential \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake
          
          pip install --upgrade pip
          
          # İŞTE BURASI ÇOK ÖNEMLİ: Sürümü kilitledik!
          pip install buildozer "cython==0.29.36" virtualenv

      # 4. APK'yı Üret
      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      # 5. Sonucu Yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hdpe-takip-apk
          path: bin/*.apk
